# Meant for the RHDP order page; the Field Sourced Content - OpenShift Base order does not show it
# (2026-11-06), so the facilitator page also gives the Showroom URL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-userinfo
  namespace: {{ .Values.lab.namespace }}
  labels:
    demo.redhat.com/userinfo: ""
data:
  showroom_url: "https://showroom-{{ .Values.showroom.namespace }}.{{ .Values.deployer.domain }}"
  lab_namespace: {{ .Values.lab.namespace | quote }}

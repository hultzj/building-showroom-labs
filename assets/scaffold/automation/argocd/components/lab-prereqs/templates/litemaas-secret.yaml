{{- if .Values.litemaas.enabled }}
# The RHDP order's LiteMaaS virtual key, under the names the OpenAI SDKs read. Workloads use it with
# envFrom; to let the terminal read it, add `get` with resourceNames: [litemaas] to its Role.
apiVersion: v1
kind: Secret
metadata:
  name: litemaas
  namespace: {{ .Values.lab.namespace }}
  labels:
    demo.redhat.com/application: {{ .Values.partOf }}
type: Opaque
stringData:
  # The order's URL may or may not end in /v1; normalise to <base>/v1.
  OPENAI_BASE_URL: {{ printf "%s/v1" (required "litemaas.apiUrl is required" .Values.litemaas.apiUrl | trimSuffix "/" | trimSuffix "/v1") | quote }}
  OPENAI_API_KEY: {{ required "litemaas.apiKey is required" .Values.litemaas.apiKey | quote }}
  OPENAI_MODEL: {{ required "litemaas.model is required" .Values.litemaas.model | quote }}
{{- end }}

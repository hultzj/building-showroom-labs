---
type: showroom

default_width: 30
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # The field-content Showroom chart proxies its terminal container at /terminal.
  - name: Terminal
    path: /terminal
    port: 443
  # Remove this tab where the console cannot be framed (verify.sh FAILs): pre-existing clusters,
  # and the RHDP Field Sourced Content - OpenShift Base order. The guide links the console instead.
  - name: OpenShift Console
    url: 'https://console-openshift-console.${DOMAIN}'
